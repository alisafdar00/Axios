
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axios - Get Users - Get Post </title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="script.js"></script>
</head>
<body>

    <h1>User List</h1>
    <ul id="userList"></ul>
    <h1>Post List</h1>
    <ul id="postGet"></ul>
    <script>
        getUsers()
            .then(users => {
                console.log(users);

                const userList = document.getElementById("userList");

                users.forEach(user => {
                    const li = document.createElement("li");
                    li.textContent = `${user.id} - ${user.name} (${user.email})`;
                    userList.appendChild(li);
                });
            })
            .catch(err => {
                console.error("Failed to load users:", err);
            });

        
    </script>
    <script>
        getPosts().then(posts => {
            const postList = document.getElementById("postGet");
            posts.forEach(post => {
                const li = document.createElement("li");
                li.textContent =  `${post.userId} - ${post.id} - ${post.title} - ${post.body}`;
                postList.appendChild(li);
            });
            

        })
    </script>
</body>
</html>
